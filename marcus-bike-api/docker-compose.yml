version: '3.8'

services:
  db:
    image: postgres:16
    container_name: marcus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["dev", "migration"]

  db_test:
    image: postgres:16
    container_name: marcus_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    profiles: ["test", "migration"]

  app:
    build: .
    container_name: marcus_api
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    command: ["java", "-jar", "app.jar"]
    profiles: ["dev"]

  flyway:
    image: flyway/flyway:10
    container_name: marcus_flyway
    depends_on:
      - db
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: public
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_CLEAN_DISABLED: false
    command: -connectRetries=10 migrate
    profiles: ["migration"]

  flyway_test:
    image: flyway/flyway:10
    container_name: marcus_flyway_test
    depends_on:
      - db_test
    volumes:
      - ./src/test/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db_test:5432/${POSTGRES_TEST_DB}
      FLYWAY_USER: ${POSTGRES_TEST_USER}
      FLYWAY_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      FLYWAY_SCHEMAS: public
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_CLEAN_DISABLED: false
    command: -connectRetries=10 migrate
    profiles: ["migration"]

  app_test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: marcus_api_test
    depends_on:
      - db_test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_test:5432/${POSTGRES_TEST_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TEST_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    profiles: ["test"]

volumes:
  pgdata:
  pgdata_test:
