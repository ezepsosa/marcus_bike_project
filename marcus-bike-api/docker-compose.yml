version: '3.8'

services:
  db:
    image: postgres:16
    container_name: marcus_postgres
    restart: always
    environment:
      POSTGRES_DB: marcusbike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: marcus_postgres_test
    restart: always
    environment:
      POSTGRES_DB: marcus_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  app:
    build: .
    container_name: marcus_api
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/marcusbike
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: rX93PzTnV6kLq2YwFj8HdUmXsAeN0g5B7hsb652GSusgkmds9rX93PzTnV6kLq2YwFj8HdUmXsAeN0g5B7hsb652GSusgkmds9
      JWT_EXPIRATION: 7200000
      JWT_REFRESH_EXPIRATION: 604800000
    command: ["java", "-jar", "app.jar"]

  flyway:
    image: flyway/flyway:10
    container_name: marcus_flyway
    depends_on:
      - db
    command: -connectRetries=10 migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/marcusbike
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: admin
      FLYWAY_SCHEMAS: public
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_CLEAN_DISABLED: false

  flyway_test:
    image: flyway/flyway:10
    container_name: marcus_flyway_test
    depends_on:
      - db_test
    command: -connectRetries=10 migrate
    volumes:
      - ./src/test/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db_test:5432/marcus_test_db
      FLYWAY_USER: test_user
      FLYWAY_PASSWORD: test_password
      FLYWAY_SCHEMAS: public
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_CLEAN_DISABLED: false

volumes:
  pgdata:
  pgdata_test:
