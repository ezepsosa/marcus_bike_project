spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_TEST_DB}
spring.datasource.username=${POSTGRES_TEST_USER}
spring.datasource.password=${POSTGRES_TEST_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tests
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

jwt.secret=TestSuperSecretKeyThatIsAtLeast32CharactersLong
jwt.expiration=7200000
jwt.refresh-expiration=604800000
